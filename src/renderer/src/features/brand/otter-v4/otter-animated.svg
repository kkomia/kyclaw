<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" shape-rendering="crispEdges" class="otter" role="img" aria-labelledby="kyclaw-otter-t kyclaw-otter-d">
<title id="kyclaw-otter-t">kyclaw · 守页海獭（像素）</title>
<desc id="kyclaw-otter-d">48×48 像素栅格：一只暖棕海獭把下巴搁在一页纸上，纸右上角折起一角，页内两行灰字与一枚陶土橙光标；4 秒循环，光标闪一次、海獭眨一次眼。</desc>
<style>.otter{--page:#ffffff;--ink:#141413;--fur:#8a6647;--cream:#e8dcc8;--nose:#5c3f2a;--eye:#141413;--line:#b0aea5;--clay:#d97757}
.otter.dark{--page:#1e1e1d;--ink:#faf9f5;--fur:#a9835f;--line:#8f8d84;--clay:#e08a6d}
@media (prefers-color-scheme:dark){.otter:not(.light):not(.dark){--page:#1e1e1d;--ink:#faf9f5;--fur:#a9835f;--line:#8f8d84;--clay:#e08a6d}}
.f-page{fill:var(--page)}.f-ink{fill:var(--ink)}.f-fur{fill:var(--fur)}.f-cream{fill:var(--cream)}.f-nose{fill:var(--nose)}.f-eye{fill:var(--eye)}.f-line{fill:var(--line)}.f-clay{fill:var(--clay)}
.strip{animation:kyclaw-frames 4s steps(1,end) infinite}
@keyframes kyclaw-frames{0%{transform:translateX(0)}37.5%{transform:translateX(-48px)}50%{transform:translateX(0)}55%{transform:translateX(-96px)}60%{transform:translateX(0)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.strip{animation:none}}
.otter.reduced .strip{animation:none}</style>
