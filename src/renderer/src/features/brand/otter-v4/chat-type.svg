<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges" class="otter-chat otter-chat--type" role="img" aria-labelledby="kyclaw-chat-type-t kyclaw-chat-type-d">
<title id="kyclaw-chat-type-t">kyclaw · 守页海獭 · 聊天状态（像素） · 打字 · 纸页一行前进 + 光标跟走</title>
<desc id="kyclaw-chat-type-d">32×32 像素栅格：一只暖棕海獭把下巴搁在一页纸上，纸右上角折起一角，页内两行灰字与一枚陶土橙光标；此文件为聊天输入卡状态灯的一态（打字：纸页第一行逐帧变长、光标跟着右走，头部 1 px 起伏），共 4 帧、360 ms 循环，帧间只有整数像素差。</desc>
<style>.otter-chat{--page:#ffffff;--ink:#141413;--fur:#8a6647;--cream:#e8dcc8;--nose:#5c3f2a;--eye:#141413;--line:#b0aea5;--clay:#d97757}
.otter-chat.dark{--page:#1e1e1d;--ink:#faf9f5;--fur:#a9835f;--line:#8f8d84;--clay:#e08a6d}
@media (prefers-color-scheme:dark){.otter-chat:not(.light):not(.dark){--page:#1e1e1d;--ink:#faf9f5;--fur:#a9835f;--line:#8f8d84;--clay:#e08a6d}}
.f-page{fill:var(--page)}.f-ink{fill:var(--ink)}.f-fur{fill:var(--fur)}.f-cream{fill:var(--cream)}.f-nose{fill:var(--nose)}.f-eye{fill:var(--eye)}.f-line{fill:var(--line)}.f-clay{fill:var(--clay)}
.otter-chat--type .pixel-otter-strip{animation:chat-type-frames 360ms steps(4) infinite}@keyframes chat-type-frames{to{transform:translateX(-128px)}}@media (prefers-reduced-motion:reduce){.otter-chat--type .pixel-otter-strip{animation:none;transform:translateX(-96px)}}.otter-chat--type.reduced .pixel-otter-strip{animation:none;transform:translateX(-96px)}</style>
