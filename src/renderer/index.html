<!doctype html>
<html lang="zh-CN" data-startup-completed-stages="shell-visible">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>kyclaw</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- connect-src 放行 127.0.0.1 的任意端口：主进程内嵌的 agent 服务每次启动端口随机（T6） -->
    <!--
      frame-src（M3-S1，整个 0.2.0 Office 接入里**主 CSP 唯一**的改动，别再加别的）：
      嵌 Office 隔离面用。两个来源：
        · kyclaw-office:     preview / 打包态的隔离面（另一个 origin，无 preload、无 window.kyclaw）；
        · http://localhost:5173  dev 的 Vite 页面（dev 下 iframe 与主窗口同源，隔离不成立，只影响开发期）。
      script-src 仍是 'self'（**没有** wasm-unsafe-eval）：编辑器的 WASM 只在 office 面的 CSP 里放开，
      探针断言主 frame 的 WebAssembly.compile 必须被拒（.superpowers/handover/office-docx-plan.md §3.4）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; frame-src 'self' kyclaw-office: http://localhost:5173"
    />
    <!--
      012（启动白屏，用户返工：要确定的百分比进度）：启动画面写死在 HTML 壳里，样式也内联 ——
      模块脚本是 defer 的，这段标记与样式会先画出来（窗口 ready-to-show 一露就是它），
      不用等 React bundle 解析/执行。

      百分比是**阶段百分比**（不是耗时、不是预计剩余时间）：五个真实里程碑等权
      （每完成一个 +20%）；这里只写初始阶段（壳已显示，20%）；bundle 执行、设置读盘完成、
      React 首屏提交、壳退场由 lib/startup-splash.ts 推进。没有按时间补数的定时器
      （宽度过渡只跟随已完成的阶段值，不会自己往前走）；卡在某一阶段就停在最近完成值。
      晚到的阶段不会让百分比倒退：壳还在时用下方 .app-splash__detail 写明已完成什么。

      80 → 100 不在 React 的同一个 layout effect 里写：100% 与退场由
      dismissStartupSplash 排到下一次绘制之后，再等宽度过渡走完才淡出。

      主题口径：窗口底色（main/window.ts 的 backgroundColor）本来就按系统主题取
      #fbfaf9 / #181817；这里用 prefers-color-scheme 跟同一个来源，避免在应用主题读盘前
      先闪一层相反色。标记里的 20 必须与 STARTUP_STAGES['shell-visible'] 一致（单测核对）。
    -->
    <style>
      :root {
        color-scheme: light dark;
        /* P0 身份层（Claude 保底）：启动画面与首屏同色同墨，避免闪旧色。
           内联样式先于 bundle 里的 identity.css 生效，所以这里写字面量而不是 var()。 */
        --splash-bg: #fcfcfb;
        --splash-ink: #141413;
        --splash-muted: #6e6a60;
        --splash-track: rgba(20, 20, 19, 0.09);
        --splash-accent: #d97757;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #141413;
          --splash-ink: #faf9f5;
          --splash-muted: #b0aea5;
          --splash-track: rgba(255, 255, 255, 0.1);
          --splash-accent: #d97757;
        }
      }

      html,
      body,
      #root {
        height: 100%;
      }

      html {
        background: var(--splash-bg);
      }

      /* 注意：body 上不要写 font-family——内联样式未分层，会压过 tailwind @layer base 的
         --font-ui（A5 真机验收的 P1 字体 bug：界面中文因此落到微软雅黑）。字体只给启动画面。 */
      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-ink);
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-ink);
        user-select: none;
        transition: opacity 180ms ease;
        /* 启动画面属界面声部：与 --font-ui 同一中文链（DSH 同款，Noto Sans SC 起） */
        font-family:
          'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      #app-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      /* 首屏在提交前失败：停在明确错误文案上，不再显示进度 */
      #app-splash.is-failed .app-splash__track,
      #app-splash.is-failed .app-splash__percent,
      #app-splash.is-failed .app-splash__detail {
        visibility: hidden;
      }

      #app-splash.is-failed .app-splash__status {
        color: var(--splash-ink);
        font-weight: 500;
      }

      .app-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding-bottom: 4vh;
      }

      /* ── 像素海獭 splash（2026-10-18 rev3 暖棕圆脸版 · 设计稿 §5.1）────────────────
         loading 6 帧 ×80ms loop；sprite @4x（6×96px）显示 128（最近邻，image-rendering:pixelated）。
         sheet 用 data URI 内联：splash 先于 bundle 与任何网络请求，零外链/零额外请求；
         浅/深两套跟随 prefers-color-scheme（与上面 --splash-* 同一来源，应用主题读盘前不会闪反色）。
         reduced-motion：停动画、停在 reducedFrame #0（静态帧，不隐藏）。 */
      .app-splash__otter {
        position: relative;
        width: 128px;
        height: 128px;
      }

      .app-splash__otter-frame {
        position: absolute;
        inset: 0;
        background-repeat: no-repeat;
        background-position-x: 0;
        background-size: 768px 128px;
        image-rendering: pixelated;
        animation: app-splash-otter 480ms steps(6) infinite;
      }

      }

      .app-splash__otter-frame--dark {
        display: none;
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkAAAABgCAYAAAD1qc0pAAAFv0lEQVR42u3dsVFczRIG0A0ClwSIRT4B4CgDctho5JAFFh6uHLnKAFx2jG2Gmbk7PXO+qms9/QJOd1++V0Wh00lERCRh/v99/fj6EBEREREFSEREREQBEhEREVGARERERHIVnughJiIiIgqQiIiIiAIkIiIiogCJ/HwhiYiIiO8/YgFFRER8/xELKCIi4vuPWEARERHffyTXwvkhNBEREVGAFCARERFRgEREREQUIBEREZG1C9HogjW6kM1e8Pjz58+fP3/+BuAA+PPnz58/f/4G4AD48+fPnz9//gbgAPjz58+fP3/+rTn//vXx9Yk+wegLejk/DX1qQcv/vfx6+R/rP9tB2H/7z58//z39DYC/AmT/7T9//vwVIAPgrwDZf/78+fNXgAyAvwJk//nz589/9QIUfQGjgXsPqPbr5T/Wf7YfgrP//Pnz57+nvwHwV4DsP3/+/PkrQAbAXwGy//z58+evABkAfwXI/vPnz5//agWoFfzh/u7i+ff25+LpDVz78bL94678+fPnz58/fwNwAPz58+fPnz9/A3AA/Pnz58+fP38DcAD8+fPnz58//1sPoHxGDyD6eLsdAH/+/Pnz58/fABwAf/78+fPnz98A+PPnz58/f/78DYA/f/78+fPnv59/6y9amn0Asw+EP3/+/Pnz528ADoA/f/78+fPnbwAOgD9//vz58+dvAA6AP3/+/Pnz53/rAZRP+YuRIrDo6f2LnVY7AP78+fPnz5+/ATgA/vz58+fPn78BOAD+/Pnz58+fvwE4AP78+fPnz18Bqh1ICRI9EWjtAKJn9V+ExZ8/f/78+fM3AAfAnz9//vz58zcAB8CfP3/+/PnzNwAHwJ8/f/78+fOvHUBv8KP/fPYD4M+fP3/+/PkbgAPgz58/f/78+RuAA+DPnz9//vz5G4AD4M+fP3/+/Pm3pnYArWC9//tT8vDnv7J/9ILkb//58zcAB8CfvwLE3/7z528ADoA/fwWIv/3nz98AHAB//goQf/vPn/8cA2j9x9laPx5//vz7FZLehSd67L/958/fABwAf/4KkP23//z5G4AD4M9fAbL/9p8/fwNwAPz5K0D23/7z559zQID58z/Ov7aQjC5E9t/+8+dvAAbAn78CZP/tP3/+BmAA/PkrQPbf/vPnbwAGwJ+/AmT/7T9//nOk9oV66xfw0S9s/vxn9o8+Hn/7z58/fwNwAPwVIP72nz9//gbAn78CxN/+8+evABkAf/4KEH/7z5//mv6jf3FZ+cz2DYH/3gdg//lv9f9w7T9/738H4AAcgP23/wqQ/eevADkA/gqQ/eevANl//gqQA+CvANl//gqQ/ee/zDxawXv/44etINl/CCy7f7Z52H/7f6T/at9w7T//1PNwAA5AAbL/9l8Bsv/8FSAHwF8Bsv/8FSD7z18BcgD8FSD7z18Bsv/8Fy9AD/d3V5/yz78/P159yj//cn66eKKPVwta/v3ZDmB2/9XmYf/t/5H+sxcg+89/p/e/A3AACpD9t/8KkP3nrwA5AP4KkP3nrwDZf/4KkAPgrwDZf/4KkP33/l+9AJWfcC1Y+ZQDif7+WtBsL5xs/q2fb7ZvAPafP3/+/L/3/s/2Q+cOgL8CZP/58+fPXwFyAPwVIPvPnz9//gqQA+CvANl//vz5e/+vXoBqv8ASNAKPfohrt2+42fx3m4f958+fP/+fvf8VIAegAClA9p8/f/4KkALkABQgBcj+8+fPXwEyAAegAPG3//z581eArqf8x8pmG8jRPxTV+vfVevLvOw/+9p8/f/7e/9/yNAAHoADxt//8+fNXgByAA1CA7L/958+fvwLkAByAAmT/7T9//vwXK0C1af0A5X/f+xMe/fcdvbC9P/6tP/9s/vZ/rv2f/evJNl/77/3v/e8AHIADsP8KkAJk/73/vf8dgANwAPZfAVKA7L/3v/e/A3AADsD+K0AKkP33/k+7L59LCk1vDxnWjwAAAABJRU5ErkJggg==');
      }

      @media (prefers-color-scheme: dark) {
        .app-splash__otter-frame--light {
          display: none;
        }

        .app-splash__otter-frame--dark {
          display: block;
        }
      }

      @keyframes app-splash-otter {
        to {
          background-position-x: -768px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__otter-frame {
          animation: none;
        }
      }

      .app-splash__wordmark {
        font-size: 21px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }

      /* 确定进度条：宽度只由阶段完成事件推动（见 lib/startup-splash.ts），没有无限动画 */
      .app-splash__track {
        position: relative;
        width: 180px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-track);
      }

      .app-splash__fill {
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        transition: width 180ms ease;
      }

      .app-splash__meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        width: 180px;
      }

      .app-splash__status {
        margin: 0;
        color: var(--splash-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .app-splash__percent {
        color: var(--splash-muted);
        font-size: 12px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .app-splash__percent-label {
        margin-right: 2px;
        opacity: 0.72;
      }

      /* 晚到阶段（例如设置读盘晚于 React 提交）的完成状态；百分比不倒退 */
      .app-splash__detail {
        margin: 0;
        color: var(--splash-muted);
        font-size: 11px;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }

        .app-splash__fill {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div
      id="app-splash"
      role="status"
      aria-live="polite"
      aria-label="kyclaw 正在启动"
      data-startup-stage="shell-visible"
      data-startup-percent="20"
    >
      <div class="app-splash__inner">
        <div class="app-splash__otter" aria-hidden="true">
          <span class="app-splash__otter-frame app-splash__otter-frame--light"></span>
          <span class="app-splash__otter-frame app-splash__otter-frame--dark"></span>
        </div>
        <div class="app-splash__wordmark" aria-hidden="true">kyclaw</div>
        <div
          class="app-splash__track"
          role="progressbar"
          aria-label="启动阶段进度"
          data-progress-kind="stages"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="20"
          aria-valuetext="启动阶段 20%，正在启动…"
        >
          <div class="app-splash__fill" style="width: 20%"></div>
        </div>
        <div class="app-splash__meta">
          <p class="app-splash__status">正在启动…</p>
          <span class="app-splash__percent" aria-hidden="true"
            ><span class="app-splash__percent-label">阶段</span>
            <span class="app-splash__percent-value">20%</span></span
          >
        </div>
        <p class="app-splash__detail" hidden></p>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
