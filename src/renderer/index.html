<!doctype html>
<html lang="zh-CN" data-startup-completed-stages="shell-visible">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>kyclaw</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- connect-src 放行 127.0.0.1 的任意端口：主进程内嵌的 agent 服务每次启动端口随机（T6） -->
    <!--
      frame-src（M3-S1，整个 0.2.0 Office 接入里**主 CSP 唯一**的改动，别再加别的）：
      嵌 Office 隔离面用。两个来源：
        · kyclaw-office:     preview / 打包态的隔离面（另一个 origin，无 preload、无 window.kyclaw）；
        · http://localhost:5173  dev 的 Vite 页面（dev 下 iframe 与主窗口同源，隔离不成立，只影响开发期）。
      script-src 仍是 'self'（**没有** wasm-unsafe-eval）：编辑器的 WASM 只在 office 面的 CSP 里放开，
      探针断言主 frame 的 WebAssembly.compile 必须被拒（.superpowers/handover/office-docx-plan.md §3.4）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; frame-src 'self' kyclaw-office: http://localhost:5173"
    />
    <!--
      PB-045 / P2-E：CJK 预设字体的 **preload**（保留 ui-fonts.css 的 font-display: swap）。
      目标机是内网慢盘、无系统 CJK 预设：8.33MB 的 NotoSansSC-Regular.otf 若等首次中文布局才请求，
      swap 窗口 = 读取+解析（HDD 163–635ms），用户会在已开始阅读时看到整页换字/重排。
      preload 把请求起点从"首次中文布局（≈150–300ms）"提前到 HTML 解析（≈10–30ms），不阻塞渲染
      （不是 render-blocking），不拖 FCP。
      ⚠️ 不加 crossorigin：打包态是 file://，Chromium 实测带 crossorigin（anonymous / use-credentials）
      都会报 "preload ... is not used because the request mode/credentials mode does not match"
      （preload 白费、字体仍等 CSS 才请求）；去掉后 preload 被 CSS 字体请求复用（见 pb-045 报告 §P2-E）。
      构建后该 href 必须与 ui-fonts.css 的 url() 解析成**同一个 hashed 资产**。
    -->
    <link
      rel="preload"
      as="font"
      type="font/otf"
      href="../../node_modules/@betteroffice/fonts-cjk/assets/NotoSansSC-Regular.otf"
    />
    <!--
      012（启动白屏，用户返工：要确定的百分比进度）：启动画面写死在 HTML 壳里，样式也内联 ——
      模块脚本是 defer 的，这段标记与样式会先画出来（窗口 ready-to-show 一露就是它），
      不用等 React bundle 解析/执行。

      百分比是**阶段百分比**（不是耗时、不是预计剩余时间）：五个真实里程碑等权
      （每完成一个 +20%）；这里只写初始阶段（壳已显示，20%）；bundle 执行、设置读盘完成、
      React 首屏提交、壳退场由 lib/startup-splash.ts 推进。没有按时间补数的定时器
      （宽度过渡只跟随已完成的阶段值，不会自己往前走）；卡在某一阶段就停在最近完成值。
      晚到的阶段不会让百分比倒退：壳还在时用下方 .app-splash__detail 写明已完成什么。

      80 → 100 不在 React 的同一个 layout effect 里写：100% 与退场由
      dismissStartupSplash 排到下一次绘制之后，再等宽度过渡走完才淡出。

      主题口径：窗口底色（main/window.ts 的 backgroundColor）本来就按系统主题取
      #fbfaf9 / #181817；这里用 prefers-color-scheme 跟同一个来源，避免在应用主题读盘前
      先闪一层相反色。标记里的 20 必须与 STARTUP_STAGES['shell-visible'] 一致（单测核对）。
    -->
    <style>
      :root {
        color-scheme: light dark;
        /* P0 身份层（Claude 保底）：启动画面与首屏同色同墨，避免闪旧色。
           内联样式先于 bundle 里的 identity.css 生效，所以这里写字面量而不是 var()。 */
        --splash-bg: #fcfcfb;
        --splash-ink: #141413;
        --splash-muted: #6e6a60;
        --splash-track: rgba(20, 20, 19, 0.09);
        --splash-accent: #d97757;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #141413;
          --splash-ink: #faf9f5;
          --splash-muted: #b0aea5;
          --splash-track: rgba(255, 255, 255, 0.1);
          --splash-accent: #d97757;
        }
      }

      html,
      body,
      #root {
        height: 100%;
      }

      html {
        background: var(--splash-bg);
      }

      /* 注意：body 上不要写 font-family——内联样式未分层，会压过 tailwind @layer base 的
         --font-ui（A5 真机验收的 P1 字体 bug：界面中文因此落到微软雅黑）。字体只给启动画面。 */
      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-ink);
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-ink);
        user-select: none;
        transition: opacity 180ms ease;
        /* 启动画面属界面声部：与 --font-ui 同一中文链（DSH 同款，Noto Sans SC 起） */
        font-family:
          'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      #app-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      /* 首屏在提交前失败：停在明确错误文案上，不再显示进度 */
      #app-splash.is-failed .app-splash__track,
      #app-splash.is-failed .app-splash__percent,
      #app-splash.is-failed .app-splash__detail {
        visibility: hidden;
      }

      #app-splash.is-failed .app-splash__status {
        color: var(--splash-ink);
        font-weight: 500;
      }

      .app-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding-bottom: 4vh;
      }

      /* ── 守页海獭 v4-pixel splash（2026-10-18 task-96；替换 v5 sprite-sheet data URI）──
         内联 SVG（animated + static 双份）：零请求、零外链；48×48 整数栅格 + crispEdges，
         显示 128。动效 = 3 帧 sprite strip 4s steps(1,end)（光标闪 + 眨眼）；
         reduced-motion 切静态帧 A（不隐藏）。浅/深由下方 CSS 变量按 prefers-color-scheme 切，
         与 splash 的 --splash-* 同一系统偏好来源；inline SVG 首帧即完整形状，不再有 sheet 空窗。 */
      .app-splash__otter {
        --om-page: #ffffff;
        --om-ink: #141413;
        --om-fur: #8a6647;
        --om-cream: #e8dcc8;
        --om-nose: #5c3f2a;
        --om-eye: #141413;
        --om-line: #b0aea5;
        --om-clay: #d97757;
        position: relative;
        width: 128px;
        height: 128px;
      }

      .app-splash__otter svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 128px;
        height: 128px;
        shape-rendering: crispEdges;
      }

      .app-splash__otter svg.app-splash__otter--static {
        display: none;
      }

      .app-splash__otter .f-page {
        fill: var(--om-page);
      }
      .app-splash__otter .f-ink {
        fill: var(--om-ink);
      }
      .app-splash__otter .f-fur {
        fill: var(--om-fur);
      }
      .app-splash__otter .f-cream {
        fill: var(--om-cream);
      }
      .app-splash__otter .f-nose {
        fill: var(--om-nose);
      }
      .app-splash__otter .f-eye {
        fill: var(--om-eye);
      }
      .app-splash__otter .f-line {
        fill: var(--om-line);
      }
      .app-splash__otter .f-clay {
        fill: var(--om-clay);
      }

      .app-splash__otter--animated .otter-strip {
        animation: app-splash-otter-frames 4s steps(1, end) infinite;
      }

      @keyframes app-splash-otter-frames {
        0% {
          transform: translateX(0);
        }
        37.5% {
          transform: translateX(-48px);
        }
        50% {
          transform: translateX(0);
        }
        55% {
          transform: translateX(-96px);
        }
        60% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(0);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-splash__otter {
          --om-page: #1e1e1d;
          --om-ink: #faf9f5;
          --om-fur: #a9835f;
          --om-line: #8f8d84;
          --om-clay: #e08a6d;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__otter .otter-strip {
          animation: none !important;
        }

        .app-splash__otter svg.app-splash__otter--animated {
          display: none;
        }

        .app-splash__otter svg.app-splash__otter--static {
          display: block;
        }
      }

      .app-splash__wordmark {
        font-size: 21px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }

      /* 确定进度条：宽度只由阶段完成事件推动（见 lib/startup-splash.ts），没有无限动画 */
      .app-splash__track {
        position: relative;
        width: 180px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-track);
      }

      .app-splash__fill {
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        transition: width 180ms ease;
      }

      .app-splash__meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        width: 180px;
      }

      .app-splash__status {
        margin: 0;
        color: var(--splash-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .app-splash__percent {
        color: var(--splash-muted);
        font-size: 12px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .app-splash__percent-label {
        margin-right: 2px;
        opacity: 0.72;
      }

      /* 晚到阶段（例如设置读盘晚于 React 提交）的完成状态；百分比不倒退 */
      .app-splash__detail {
        margin: 0;
        color: var(--splash-muted);
        font-size: 11px;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }

        .app-splash__fill {
          transition: none;
        }
      }
    </style>
  </head>
