# 打包配置（T15）：NSIS 用户级安装包 → dist/。
# 没有代码签名证书：产物未签名，装的时候 SmartScreen 会拦一下（选"仍要运行"），见 task-15-report。
# 更新通道（T17；round 62 起接内测源）：publish 指向**内测的局域网 generic 源**（见文件末
# publish 段与它上面的说明）——打包时自动生成 latest.yml，并把指向该源的 app-update.yml 写进
# resources/。单机模拟源 / 临时切通道仍可用 env `KYCLAW_UPDATE_URL` 覆盖（见 src/main/updater.ts）。
appId: com.kkomia.kyclaw
productName: kyclaw
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,pnpm-workspace.yaml}'
  # 过程性材料不进包：docs 是设计与走查、.superpowers 是任务书/复核 diff、fixtures/scripts 只给测试与出包用
  - '!{docs,fixtures,scripts,.superpowers}/**'
  # e2e 探针（Playwright 那一套）与它的入口/配置是纯开发材料，同样不进包：e2e 源码、跑它的
  # playwright.config.ts 与 tsconfig.e2e.json、vitest 分组用的 vitest.native-specs.ts、以及
  # 给协作方看的 AGENTS.md（旧包实测 asar 顶层混着这几样 —— 2026-10-16 逐项收掉）。
  - '!e2e/**'
  - '!playwright.config.ts'
  - '!tsconfig.e2e.json'
  - '!vitest.native-specs.ts'
  - '!AGENTS.md'
  - '!build/**'
  # 根 patches/**（pnpm 的补丁输入）同样是**过程文件**：安装时由 pnpm 套用，产物里已经是打好补丁的
  # dist（随渲染端 bundle 走），.patch 原文本身不该进包。随包该有的两份**不走 files**：
  # 许可声明走下面 extraResources 的 `resources/skills → skills`（含 THIRD_PARTY_NOTICES.md），
  # 发行说明走 `build/release-notes → release-notes`。
  - '!patches/**'
  # node-pty 的调试符号（每个 6MB，只在 Windows 上有）：运行时用不到，不进包
  - '!**/node-pty/prebuilds/**/*.pdb'
  # 本机嵌入引擎的运行时（模块 3B）**不进 asar**：它由下面的 extraResources 原样放到
  # resources/llama/（进程要从磁盘上直接执行 exe/dll，asar 里的东西起不来）。
  # 不加这条会被 asarUnpack 的 resources/** 规则再抄一份进 app.asar.unpacked（白胖 42MB）。
  - '!resources/llama/**'
  # 内置技能（round 64：office 四件套的 SKILL.md）同路数：走下面的 extraResources 原样放到
  # resources/skills/，不进 asar。理由不是"asar 读不了 .md"（Electron 的 fs 能读 asar 内的文件），
  # 而是**技能目录要能被当普通目录遍历**（列文件清单、将来放 reference/scripts 子目录），
  # 且与插件的技能目录（userData 下的真目录）保持同一形态——少一条"asar 内路径"的特殊分支。
  - '!resources/skills/**'
  # render_ppt 随包的 LibreOffice 渲染引擎（round 68）：同样走下面的 extraResources 原样放到
  # resources/libreoffice-kit/。**必须不进 asar**：里面的 bin/libreoffice-kit.exe（178MB）
  # 与 program/ 要从磁盘上直接执行（asar 里的 exe 起不来），且 kit 自己用常规 Node 解析去
  # 同目录找引擎包与 koffi —— asar 内那条路径它算不出来。不加这条会被 asarUnpack 的
  # resources/** 规则再抄一份进 app.asar.unpacked（白胖 194MB）。
  - '!resources/libreoffice-kit/**'
  # 历史构建输出目录（round 62/63 的 dist-alt / dist-r63 等）**不进包**：electron-builder 只自动排除
  # 它自己的输出目录（directories.output，即 dist/），其他 dist-* 会被当普通目录收进去 ——
  # 实测 `pnpm package` 出来的 app.asar 里塞了 4.3GB 的旧构建产物（dist-r63 的 asar 又把 dist-alt
  # 整个卷进去，层层套娃）。安装包因此能到 GB 级。
  - '!dist*/**'
  # PB-016（减包）三样白占 asar 的东西（量的口径见 .superpowers/pb016/asar-before.json）：
  #   · `**/*.map`（140.66 MiB / 5,136 个，全在 node_modules 里）：sourcemap 只在"从报错栈回源码"时
  #     有用，用户装的正式包既没有源码也没有 Source Map 面板；Vite 产物自己也没带 map。
  #   · `website/**`（0.57 MiB / 9 个）：本地建站材料，未跟踪目录，builder 把它当普通目录收进包了。
  #   · `**/*.tsbuildinfo`（0.49 MiB / 1 个，tsconfig.node.tsbuildinfo）：tsc 的增量编译缓存。
  #     上面已排 `tsconfig*.json`，但 builder 的这条规则不覆盖 tsbuildinfo 这个产物后缀。
  - '!**/*.map'
  - '!website/**'
  - '!**/*.tsbuildinfo'
# 本机嵌入引擎（模块 3B）：`pnpm fetch:llama` 下到 resources/llama/ 的裁剪后运行时（42MB），
# 原样拷到安装目录的 resources/llama/（主进程按 process.resourcesPath/llama 找它）。
# .cache 是本地的压缩包缓存（获取脚本用），不进包。
extraResources:
  - from: resources/llama
    to: llama
    filter:
      - '**/*'
      - '!.cache/**'
  # 内置技能（round 64）：仓库 `resources/skills/<技能名>/SKILL.md` 原样拷到安装目录的
  # resources/skills/（主进程按 process.resourcesPath/skills 找它，开发态用仓库那份）。
  # 只有 .md 与子目录，几 KB 级——不打进 asar（见上面 files 里的排除，避免两份）。
  - from: resources/skills
    to: skills
    filter:
      - '**/*'
  # 本版本发行说明（本轮）：`build/release-notes/<版本>.md` 原样拷到安装目录的
  # resources/release-notes/ —— 「设置 → 关于」的常驻「更新日志」入口读这一份（断网 / 已是最新 /
  # 没配更新源时唯一能看的日志）。**整目录拷、不写版本号**：换版本不用改这里，主进程只按
  # `app.getVersion()` 找 `<版本>.md` 那一个文件名（找不到就说"本版暂无发行说明"，绝不借用别的版本）。
  # 上面 files 里的 `!build/**` 只影响 app 文件集，extraResources 是另一条路（与 llama/skills 同）。
  # 落点由 `pnpm package` 出包后自检（bundledNotesProblem）：漏拷 / 内容不一致都会当场停。
  - from: build/release-notes
    to: release-notes
    filter:
      - '**/*.md'
  # render_ppt 的随包 LibreOffice 渲染引擎（round 68）：`pnpm fetch:libreoffice-kit` 落的
  # npm 平铺目录（194MB 未压缩）原样拷到安装目录的 resources/libreoffice-kit/，
  # 主进程按 process.resourcesPath/libreoffice-kit 找它的 cli.js（开发态用仓库那份，见 render-ppt.ts
  # 的 kitRootCandidates）。
  # `licenses/` 与 `sources/` 必须跟着走（MPL-2.0 的分发义务：许可文本 + 源码配方/补丁，
  # 见 resources/skills/THIRD_PARTY_NOTICES.md 第 3 节），所以这里**不裁剪**任何子目录。
  #
  # **为什么拆成两条**：electron-builder 的 filter 里有一句写死的
  # `if (relative === "node_modules") return false`（app-builder-lib/out/util/filter.js）——
  # `from` 目录**根上**的那一级 node_modules 永远拷不过去（只放过嵌套的）。kit 的引擎包与 koffi
  # 全在它自己的 node_modules 里，所以那一级单独列一条、`from` 直接指到 node_modules 上
  # （那时它自己是根，里面的 @deepseek-ai / koffi … 就不再被那句拦掉）。
  - from: resources/libreoffice-kit
    to: libreoffice-kit
    filter:
      - '**/*'
      - '!node_modules/**'
  - from: resources/libreoffice-kit/node_modules
    to: libreoffice-kit/node_modules
    filter:
      - '**/*'
# asar 里 dlopen 不了 .node：libsql 的原生绑定（@libsql/win32-x64-msvc/index.node）必须解出来，
# 运行时经 Electron 的 asar 路径重定向落到 app.asar.unpacked。
# resources/** 是 electron-vite 的 ?asset 资源（托盘/窗口图标），主进程按真实路径读，同样得在 asar 外。
# node-pty（工作台终端）**动态拼路径 require 原生件**（lib/utils.js: `prebuilds/<platform>-<arch>/pty.node`）：
# 静态分析抓不到它，所以整个 prebuilds 目录显式解出来（同目录下的 winpty-agent.exe / conpty 辅助件
# 也是从磁盘上直接 spawn 的，asar 里的 exe 起不来）。
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/@libsql/**'
  - '**/node-pty/prebuilds/**'
# 更新通道（round 62）：内测走局域网 MinIO 的 generic 源——打包时自动生成 latest.yml，并把
# app-update.yml 写进 resources/（测试机开箱即"检查更新/自助下载"）；上传由 R62 的上传脚本
# 单独做，electron-builder 本身仍然 --publish never（scripts/package.mjs 写死）。
# KYCLAW_UPDATE_URL 仍可覆盖（本机模拟 / 临时切通道，见 src/main/updater.ts）。
#
# 更新说明（0.1.1）：**刻意不在这里写 releaseInfo** —— 发行日志是版本绑定的
# （build/release-notes/<版本>.md），由 `pnpm package` 出包时按 package.json 的版本现算，
# 用标准的 `-c.releaseInfo.releaseNotesFile=release-notes/<版本>.md` 传给 electron-builder，
# 由它写进 latest.yml 的 releaseNotes（客户端「设置 → 关于」的「更新内容」显示这一段）。
# 写死在这里的路径换版本号不会跟着变——那正是"下一版复用上一版日志"的坑。
publish:
  provider: generic
  url: http://192.168.31.18:9000/kyclaw/releases/
win:
  executableName: kyclaw
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # 用户级安装（不需管理员，装到 %LOCALAPPDATA%\Programs\kyclaw）
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 卸载保留 userData：%APPDATA%\kyclaw 里是会话库与 safeStorage 密钥，重装还得用
  deleteAppDataOnUninstall: false
compression: normal
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
